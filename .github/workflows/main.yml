name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare project
        run: |
          unzip -q waqtuka-android.zip
          cp -r pkg/www pkg/patch_manifest.py pkg/android-native .
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "وقتك ثمين" com.waqtuka.app --web-dir www
          npx cap add android
          cp android-native/java/*.java android/app/src/main/java/com/waqtuka/app/
          python3 patch_manifest.py
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: waqtuka-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
